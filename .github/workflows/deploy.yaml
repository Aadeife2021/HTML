          # fix your permission 
          ssh -i firewall-webserver.pem -o StrictHostKeyChecking=no ubuntu@13.220.148.118 "sudo chown -R ubuntu:www-data /var/www/HTML"
          ssh -i firewall-webserver.pem -o StrictHostKeyChecking=no ubuntu@13.220.148.118 "sudo chmod -R 755 /var/www/HTML"
